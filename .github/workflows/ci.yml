name: Forge
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m rhoforge examples/escrow.json --out build-escrow
          cmp examples/generated/factory.rho build-escrow/factory.rho
          cmp examples/generated/manifest.json build-escrow/manifest.json
  rholo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify pinned public Rholo binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local
          gh api repos/rhovision-org/rholo/actions/artifacts/14977847392/zip > .local/rholo.zip
          echo 'f2ecced8a2b085183654828e1061f67469b95e225f1ae8ce022ea8fd9a5167e1  .local/rholo.zip' | sha256sum -c
          unzip -q .local/rholo.zip -d .local/rholo
          chmod 700 .local/rholo/rnode
      - name: Execute generated actors on native Rholo
        run: |
          PYTHONPATH=. python tools/probe_generated.py --binary .local/rholo/rnode --sha256 232d12bd5d3fadc8371c26ec6a888ea48a4062b1187bb63c35b9d19423f28ead --commit e63b7e5a8ccfcc25ff64860ac989d95a748eaaca --repeats 5 --output .local/runtime.json
          PYTHONPATH=. python tools/check_evidence.py .local/runtime.json
          PYTHONPATH=. python tools/probe_partition.py --binary .local/rholo/rnode --sha256 232d12bd5d3fadc8371c26ec6a888ea48a4062b1187bb63c35b9d19423f28ead --commit e63b7e5a8ccfcc25ff64860ac989d95a748eaaca --out .local/partition-runtime.json
          PYTHONPATH=. python tools/benchmark_partition.py --out .local/partition-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: forge-native-runtime
          path: |
            .local/runtime.json
            .local/partition-runtime.json
            .local/partition-benchmark.json
          if-no-files-found: error
