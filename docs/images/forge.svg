<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
<title id="title">Rho Forge: from finite resource flows to executable actors</title><desc id="desc">Resource places, consumption, production and permissions become an enumerated marking graph and shortest authorized missions. Forge emits a Rholang actor with a private state cell.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#83d9c6"/></marker></defs>
<rect x="1" y="1" width="1078" height="388" rx="20" fill="#142333" stroke="#394e62"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="40" y="48" fill="#83d9c6" font-size="14" font-weight="700" letter-spacing="3">R H O / F O R G E</text>
<text x="40" y="92" fill="#f0f5fa" font-size="32" font-weight="700">From resource flows to executable actors.</text>
<text x="40" y="122" fill="#b6c7d9" font-size="16">Write down what moves, who can move it, and what should remain conserved.</text>
<g fill="#203344" stroke="#42586c"><rect x="40" y="155" width="280" height="176" rx="12"/><rect x="760" y="155" width="280" height="176" rx="12"/></g>
<rect x="360" y="155" width="360" height="176" rx="12" fill="#203b40" stroke="#83d9c6"/>
<g fill="#83d9c6" font-size="13" font-weight="700"><text x="58" y="185">01 / DECLARE</text><text x="380" y="185">02 / SYNTHESIZE</text><text x="780" y="185">03 / GENERATE</text></g>
<g fill="#eef4fa" font-size="17"><text x="58" y="220">Bounded resource places</text><text x="58" y="255">Consume / produce</text><text x="58" y="290">Roles and missions</text><text x="380" y="220">Enumerate reachable markings</text><text x="380" y="255">Check linear conservation</text><text x="380" y="290">Find shortest authorized paths</text><text x="780" y="220">factory.rho</text><text x="780" y="255">manifest.json</text><text x="780" y="290">Private state and capabilities</text></g>
<path d="M326 245H353 M726 245H753" stroke="#83d9c6" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="365" fill="#b6c7d9" font-size="14">Finite resource workflows / Atomic internal state changes / No external Python dependencies</text>
</g></svg>
